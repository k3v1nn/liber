name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Tag of an existing release to attach the ZIPs to (leave empty to keep them as artifacts)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: windows-2022
            name: windows-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.15,<7"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python build.py
      # Release assets do not count against the Actions artifact storage quota.
      - name: Attach to release
        if: inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release }}" release/*.zip --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: ConversorEPUB-${{ matrix.name }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7
