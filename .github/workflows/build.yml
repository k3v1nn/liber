name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Tag of an existing release to attach the ZIPs to (leave empty to keep them as artifacts)"
        required: false
        default: ""
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  minimum-dependencies:
    name: Minimum declared dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the lowest declared versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install --resolution=lowest-direct -r requirements.txt
      # Only the modules that run without Qt, so a missing window library cannot mask a version floor.
      - name: Test
        run: python -m pytest -q tests/test_conversion.py tests/test_web_images.py

  build:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: windows-2022
            name: windows-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.15,<7"
      - name: Build
        run: python build.py
      # Release assets do not count against the Actions artifact storage quota.
      - name: Attach to release
        if: ${{ inputs.release || startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # Any matrix leg may create it first; a concurrent creation is not a failure.
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag || gh release view "$TAG" > /dev/null
          fi
          gh release upload "$TAG" release/*.zip --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ !(inputs.release || startsWith(github.ref, 'refs/tags/')) }}
        with:
          name: ConversorEPUB-${{ matrix.name }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7
