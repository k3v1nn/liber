name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: windows-2022
            name: windows-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.15,<7"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ConversorEPUB-${{ matrix.name }}
          path: release/*.zip
          if-no-files-found: error
